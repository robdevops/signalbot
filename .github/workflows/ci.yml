name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: build tags
        run: |
          go vet -tags nocharts ./...
          go test -tags nocharts .
          if go build -tags nosignal -o /dev/null . 2> /tmp/nosignal.txt; then
            echo "a build with no chat network should fail"; exit 1
          fi
          grep -q this_build_has_no_chat_network /tmp/nosignal.txt || { cat /tmp/nosignal.txt; exit 1; }
      - name: memory at real size, too slow under -race
        run: go test -run AtRealSize ./internal/kit/img/
      - name: sizes
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git worktree add -q /tmp/base "origin/$GITHUB_BASE_REF"
            go run ./internal/arch/sizes -root /tmp/base -json > /tmp/base.json
            go run ./internal/arch/sizes -base /tmp/base.json >> "$GITHUB_STEP_SUMMARY"
          else
            go run ./internal/arch/sizes >> "$GITHUB_STEP_SUMMARY"
          fi
